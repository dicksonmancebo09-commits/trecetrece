name: GBA diagnostic toolchain

on:
  workflow_dispatch:
  push:
    paths:
      - ".devcontainer/devcontainer.json"
      - "config/gba_lab.json"
      - "tools/install_gba_emulator.sh"
      - "tools/run_gba_diagnostic.sh"
      - "tools/run_gba_diagnostic.py"
      - "tools/gba_rom_audit.py"
      - "tools/apply_guarded_patch.py"
      - "tests/test_gba_rom_audit.py"
      - "tests/test_apply_guarded_patch.py"
      - "tests/test_gba_config.py"
      - ".github/workflows/gba-diagnostic-toolchain.yml"
  pull_request:
    paths:
      - ".devcontainer/devcontainer.json"
      - "config/gba_lab.json"
      - "tools/install_gba_emulator.sh"
      - "tools/run_gba_diagnostic.sh"
      - "tools/run_gba_diagnostic.py"
      - "tools/gba_rom_audit.py"
      - "tests/test_gba_rom_audit.py"
      - ".github/workflows/gba-diagnostic-toolchain.yml"

permissions:
  contents: read

jobs:
  validate-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mGBA and diagnostic dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mgba-qt mgba-sdl xvfb xauth xdotool imagemagick zip python3

      - name: Confirm emulator installation
        run: |
          if command -v mgba-qt >/dev/null 2>&1; then
            mgba-qt --version
          elif test -x /usr/games/mgba-qt; then
            /usr/games/mgba-qt --version
          else
            echo "mGBA Qt executable was not found" >&2
            exit 1
          fi
          xvfb-run --help >/dev/null
          xdotool --version
          import -version | head -n 2

      - name: Validate parameter profile
        run: |
          python3 -m json.tool config/gba_lab.json >/dev/null
          python3 tools/gba_rom_audit.py --help >/dev/null
          python3 tools/run_gba_diagnostic.py --help >/dev/null

      - name: Check Python and shell syntax
        run: |
          python3 -m py_compile tools/metroid_gba_probe.py tools/gba_rom_audit.py tools/run_gba_diagnostic.py tools/apply_guarded_patch.py
          bash -n tools/install_gba_emulator.sh
          bash -n tools/run_gba_diagnostic.sh

      - name: Unit tests — ROM audit
        run: python3 -m unittest discover -s tests -p "test_gba_rom_audit.py" -v

      - name: Unit tests — guarded patching
        run: python3 -m unittest discover -s tests -p "test_apply_guarded_patch.py" -v

      - name: Check guarded patch CLI
        run: python3 tools/apply_guarded_patch.py --help >/dev/null

      - name: Unit tests — configuration invariants
        run: python3 -m unittest discover -s tests -p "test_gba_config.py" -v

      - name: State test boundary
        run: |
          echo "mGBA and the profile-driven tools are installed and tested."
          echo "No ROM was run: test ROMs remain in ignored private-roms/ and are not stored in GitHub."
