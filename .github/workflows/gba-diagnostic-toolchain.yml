name: GBA diagnostic toolchain

on:
  workflow_dispatch:
  push:
    paths:
      - ".devcontainer/devcontainer.json"
      - "config/gba_lab.json"
      - "tools/install_gba_emulator.sh"
      - "tools/run_gba_diagnostic.sh"
      - "tools/run_gba_diagnostic.py"
      - "tools/gba_rom_audit.py"
      - "tools/extract_sector_cero_room_maps.py"
      - "tools/extract_sector_cero_room_visual_assets.py"
      - "tools/render_v17_room0.py"
      - "tools/render_v18_room0.py"
      - "tools/fix_v17_room0_palette_bank.py"
      - "tools/apply_guarded_patch.py"
      - "tests/test_fix_v17_room0_palette_bank.py"
      - "tools/generate_mgba_lua_trace.py"
      - "tools/mgba/trace_gba.lua.in"
      - "tests/test_gba_rom_audit.py"
      - "tests/test_apply_guarded_patch.py"
      - "tests/test_gba_config.py"
      - "tests/test_gba_lua_trace_generator.py"
      - ".github/workflows/gba-diagnostic-toolchain.yml"
      - "data/world/sector-cero-room-registry-v1.json"
      - "data/world/sector-cero-room-batch-*.json"
      - "data/world/sector-cero-production-manifest-v1.json"
      - "data/world/sector-cero-room-technical-sheets-v1.json"
      - "docs/villa-duarte-sector-cero/LEVEL_ROOM_MASTER_PLAN_V2.md"
      - "docs/villa-duarte-sector-cero/PRODUCTION_BATCH_04_87_ROOMS.md"
      - "docs/villa-duarte-sector-cero/PRODUCTION_BATCH_05_34_ROOMS.md"
      - "tools/audit_sector_cero_rooms.py"
      - "tests/test_audit_sector_cero_rooms.py"
      - "tools/export_neighborhood_atlases.py"
      - "assets/levels/**/level-*-atlas-v*.svg"
      - "assets/levels/**/level-*-atlas-v*.json"
      - "assets/tiles/scenario-02/scenario-02-el-caliche-tiles.svg"
      - "assets/tiles/scenario-02/tile-atlas-metadata.json"
  pull_request:
    paths:
      - ".devcontainer/devcontainer.json"
      - "config/gba_lab.json"
      - "tools/install_gba_emulator.sh"
      - "tools/run_gba_diagnostic.sh"
      - "tools/run_gba_diagnostic.py"
      - "tools/gba_rom_audit.py"
      - "tools/apply_guarded_patch.py"
      - "tools/generate_mgba_lua_trace.py"
      - "tools/mgba/trace_gba.lua.in"
      - "tests/test_gba_rom_audit.py"
      - "tests/test_apply_guarded_patch.py"
      - "tests/test_gba_config.py"
      - "tests/test_gba_lua_trace_generator.py"
      - ".github/workflows/gba-diagnostic-toolchain.yml"
      - "data/world/sector-cero-room-registry-v1.json"
      - "data/world/sector-cero-room-batch-*.json"
      - "data/world/sector-cero-production-manifest-v1.json"
      - "data/world/sector-cero-room-technical-sheets-v1.json"
      - "docs/villa-duarte-sector-cero/LEVEL_ROOM_MASTER_PLAN_V2.md"
      - "docs/villa-duarte-sector-cero/PRODUCTION_BATCH_04_87_ROOMS.md"
      - "docs/villa-duarte-sector-cero/PRODUCTION_BATCH_05_34_ROOMS.md"
      - "tools/audit_sector_cero_rooms.py"
      - "tests/test_audit_sector_cero_rooms.py"
      - "tools/export_neighborhood_atlases.py"
      - "assets/levels/**/level-*-atlas-v*.svg"
      - "assets/levels/**/level-*-atlas-v*.json"
      - "assets/tiles/scenario-02/scenario-02-el-caliche-tiles.svg"
      - "assets/tiles/scenario-02/tile-atlas-metadata.json"

permissions:
  contents: read

jobs:
  validate-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install mGBA and diagnostic dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mgba-qt mgba-sdl xvfb xauth xdotool imagemagick zip python3 python3-pil lua5.4

      - name: Confirm emulator installation
        run: |
          if command -v mgba-qt >/dev/null 2>&1; then
            mgba-qt --version
          elif test -x /usr/games/mgba-qt; then
            /usr/games/mgba-qt --version
          else
            echo "mGBA Qt executable was not found" >&2
            exit 1
          fi
          xvfb-run --help >/dev/null
          xdotool --version
          import -version | head -n 2
          luac5.4 -v

      - name: Validate parameter profile and tools
        run: |
          python3 -m json.tool config/gba_lab.json >/dev/null
          python3 tools/gba_rom_audit.py --help >/dev/null
          python3 tools/extract_sector_cero_room_maps.py --help >/dev/null
          python3 tools/extract_sector_cero_room_visual_assets.py --help >/dev/null
          python3 tools/render_v17_room0.py --help >/dev/null
          python3 tools/render_v18_room0.py --help >/dev/null
          python3 tools/fix_v17_room0_palette_bank.py --help >/dev/null
          python3 tools/run_gba_diagnostic.py --help >/dev/null
          python3 tools/apply_guarded_patch.py --help >/dev/null
          python3 tools/generate_mgba_lua_trace.py --help >/dev/null

      - name: Check Python and shell syntax
        run: |
          python3 -m py_compile tools/metroid_gba_probe.py tools/gba_rom_audit.py tools/extract_sector_cero_room_maps.py tools/extract_sector_cero_room_visual_assets.py tools/render_v17_room0.py tools/render_v18_room0.py tools/fix_v17_room0_palette_bank.py tools/run_gba_diagnostic.py tools/apply_guarded_patch.py tools/generate_mgba_lua_trace.py
          bash -n tools/install_gba_emulator.sh
          bash -n tools/run_gba_diagnostic.sh

      - name: Generate Lua trace and validate Lua syntax
        run: |
          mkdir -p private-roms/diagnostics
          python3 tools/generate_mgba_lua_trace.py
          test -s private-roms/diagnostics/mgba-trace-generated.lua
          luac5.4 -p private-roms/diagnostics/mgba-trace-generated.lua

      - name: Audit 382 room IDs, source doors and five batches
        run: |
          python3 tools/audit_sector_cero_rooms.py --json-out private-roms/diagnostics/sector-cero-room-audit.json
          python3 -m unittest discover -s tests -p "test_audit_sector_cero_rooms.py" -v

      - name: Unit tests — ROM audit
        run: python3 -m unittest discover -s tests -p "test_gba_rom_audit.py" -v

      - name: Unit tests — room-0 palette bank correction
        run: python3 -m unittest discover -s tests -p "test_fix_v17_room0_palette_bank.py" -v

      - name: Unit tests — guarded patching
        run: python3 -m unittest discover -s tests -p "test_apply_guarded_patch.py" -v

      - name: Unit tests — configuration invariants
        run: python3 -m unittest discover -s tests -p "test_gba_config.py" -v

      - name: Unit tests — mGBA Lua trace generator
        run: python3 -m unittest discover -s tests -p "test_gba_lua_trace_generator.py" -v

      - name: State test boundary
        run: |
          echo "mGBA, GBA profiles, static audit, guarded patcher and Lua trace tools are installed and tested."
          echo "No user ROM was run: test ROMs remain in ignored private-roms/ and are not stored in GitHub."

  export-neighborhood-atlases:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout production branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Install SVG and indexed-PNG tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-cairosvg python3-pil

      - name: Render and export all seven atlases
        run: |
          python3 tools/export_neighborhood_atlases.py --json-out private-atlas-export-summary.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("private-atlas-export-summary.json").read_text())
          assert data["status"] == "PASS"
          assert data["atlas_count"] == 7
          assert all(item["validation"]["4bpp_round_trip"] and item["validation"]["lz77_round_trip"] for item in data["atlases"])
          print("Seven indexed PNG, 4bpp, BGR555 and LZ77 exports validated.")
          PY

      - name: Upload generated GBA atlas assets
        uses: actions/upload-artifact@v4
        with:
          name: zector-cero-seven-gba-atlas-exports
          if-no-files-found: error
          path: |
            assets/levels/level-01-villa-duarte/exports/
            assets/tiles/scenario-02/exports/
            assets/levels/level-03-la-francia-nueva/exports/
            assets/levels/level-04-calero/exports/
            assets/levels/level-05-pueblo-nuevo/exports/
            assets/levels/level-06-los-molinos/exports/
            assets/levels/level-07-simonico/exports/
            private-atlas-export-summary.json

      - name: Commit generated source-art exports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/levels/level-01-villa-duarte/exports assets/tiles/scenario-02/exports assets/levels/level-03-la-francia-nueva/exports assets/levels/level-04-calero/exports assets/levels/level-05-pueblo-nuevo/exports assets/levels/level-06-los-molinos/exports assets/levels/level-07-simonico/exports
          if git diff --cached --quiet; then
            echo "No atlas export changes to commit."
            exit 0
          fi
          git commit -m "Export seven neighborhood atlases to GBA formats"
          git push origin "HEAD:${GITHUB_REF_NAME}"
