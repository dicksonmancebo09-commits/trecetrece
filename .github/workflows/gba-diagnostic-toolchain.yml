name: GBA diagnostic toolchain

on:
  workflow_dispatch:
  push:
    paths:
      - ".devcontainer/devcontainer.json"
      - "config/gba_lab.json"
      - "tools/install_gba_emulator.sh"
      - "tools/run_gba_diagnostic.sh"
      - "tools/run_gba_diagnostic.py"
      - "tools/gba_rom_audit.py"
      - "scripts/phase1_calero.py"
      - "tools/apply_guarded_patch.py"
      - "tools/generate_mgba_lua_trace.py"
      - "tools/mgba/trace_gba.lua.in"
      - "tests/test_gba_rom_audit.py"
      - "tests/test_phase1_calero.py"
      - "tests/test_apply_guarded_patch.py"
      - "tests/test_gba_config.py"
      - "tests/test_gba_lua_trace_generator.py"
      - ".github/workflows/gba-diagnostic-toolchain.yml"
  pull_request:
    paths:
      - ".devcontainer/devcontainer.json"
      - "config/gba_lab.json"
      - "tools/install_gba_emulator.sh"
      - "tools/run_gba_diagnostic.sh"
      - "tools/run_gba_diagnostic.py"
      - "tools/gba_rom_audit.py"
      - "tools/apply_guarded_patch.py"
      - "tools/generate_mgba_lua_trace.py"
      - "tools/mgba/trace_gba.lua.in"
      - "tests/test_gba_rom_audit.py"
      - "tests/test_apply_guarded_patch.py"
      - "tests/test_gba_config.py"
      - "tests/test_gba_lua_trace_generator.py"
      - ".github/workflows/gba-diagnostic-toolchain.yml"

permissions:
  contents: read

jobs:
  validate-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mGBA and diagnostic dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mgba-qt mgba-sdl xvfb xauth xdotool imagemagick zip python3 lua5.4

      - name: Confirm emulator installation
        run: |
          if command -v mgba-qt >/dev/null 2>&1; then
            mgba-qt --version
          elif test -x /usr/games/mgba-qt; then
            /usr/games/mgba-qt --version
          else
            echo "mGBA Qt executable was not found" >&2
            exit 1
          fi
          xvfb-run --help >/dev/null
          xdotool --version
          import -version | head -n 2
          luac5.4 -v

      - name: Validate parameter profile and tools
        run: |
          python3 -m json.tool config/gba_lab.json >/dev/null
          python3 tools/gba_rom_audit.py --help >/dev/null
          python3 scripts/phase1_calero.py --help >/dev/null
          python3 tools/run_gba_diagnostic.py --help >/dev/null
          python3 tools/apply_guarded_patch.py --help >/dev/null
          python3 tools/generate_mgba_lua_trace.py --help >/dev/null

      - name: Check Python and shell syntax
        run: |
          python3 -m py_compile scripts/phase1_calero.py tools/metroid_gba_probe.py tools/gba_rom_audit.py tools/run_gba_diagnostic.py tools/apply_guarded_patch.py tools/generate_mgba_lua_trace.py
          bash -n tools/install_gba_emulator.sh
          bash -n tools/run_gba_diagnostic.sh

      - name: Generate Lua trace and validate Lua syntax
        run: |
          mkdir -p private-roms/diagnostics
          python3 tools/generate_mgba_lua_trace.py
          test -s private-roms/diagnostics/mgba-trace-generated.lua
          luac5.4 -p private-roms/diagnostics/mgba-trace-generated.lua

      - name: Unit tests — Phase 1 Calero palette
        run: python3 -m unittest discover -s tests -p "test_phase1_calero.py" -v

      - name: Prepare exact clean-ROM palette-only test
        run: |
          mkdir -p private-roms/diagnostics
          cp "tools/mgba/Metroid Fusion (USA, Australia).gba" "private-roms/MetroidFusion_original.gba"
          python3 - <<'PY'
          import hashlib, pathlib
          path = pathlib.Path("private-roms/MetroidFusion_original.gba")
          actual = hashlib.sha256(path.read_bytes()).hexdigest()
          expected = "a56ce3d7f8f3f4f4d0468d421fff5dd3ee3aec99a58244377e43aae769dc3fe8"
          print("Repository Metroid ROM SHA-256:", actual)
          if actual != expected:
              raise SystemExit("The repository ROM differs from the known clean baseline.")
          PY
          python3 scripts/phase1_calero.py \
            --base "private-roms/MetroidFusion_original.gba" \
            --expected-base-sha256 a56ce3d7f8f3f4f4d0468d421fff5dd3ee3aec99a58244377e43aae769dc3fe8 \
            --output "private-roms/MetroidFusion_palette_test.gba" \
            --report "private-roms/diagnostics/palette-test-build.json" \
            --force

      - name: mGBA compare — clean baseline vs palette-only candidate
        continue-on-error: true
        run: |
          set +e
          python3 tools/run_gba_diagnostic.py \
            "private-roms/MetroidFusion_original.gba" \
            --profile gba_candidate_unpinned \
            --output-dir "private-roms/diagnostics/clean-base"
          base_status=$?
          python3 tools/run_gba_diagnostic.py \
            "private-roms/MetroidFusion_palette_test.gba" \
            --profile gba_candidate_unpinned \
            --output-dir "private-roms/diagnostics/palette-test"
          palette_status=$?
          printf 'clean_base_exit=%s\npalette_only_exit=%s\n' "$base_status" "$palette_status" \
            | tee "private-roms/diagnostics/mgba-comparison-status.txt"
          exit 0

      - name: Upload clean-vs-palette mGBA evidence
        if: \${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: metroid-palette-boot-comparison
          path: |
            private-roms/diagnostics/palette-test-build.json
            private-roms/diagnostics/mgba-comparison-status.txt
            private-roms/diagnostics/clean-base/
            private-roms/diagnostics/clean-base.zip
            private-roms/diagnostics/palette-test/
            private-roms/diagnostics/palette-test.zip
          if-no-files-found: warn
          retention-days: 3

      - name: Unit tests — ROM audit
        run: python3 -m unittest discover -s tests -p "test_gba_rom_audit.py" -v

      - name: Unit tests — guarded patching
        run: python3 -m unittest discover -s tests -p "test_apply_guarded_patch.py" -v

      - name: Unit tests — configuration invariants
        run: python3 -m unittest discover -s tests -p "test_gba_config.py" -v

      - name: Unit tests — mGBA Lua trace generator
        run: python3 -m unittest discover -s tests -p "test_gba_lua_trace_generator.py" -v

      - name: State test boundary
        run: |
          echo "mGBA, GBA profiles, static audit, guarded patcher and Lua trace tools are installed and tested."
          echo "No user ROM was run: test ROMs remain in ignored private-roms/ and are not stored in GitHub."
